<!DOCTYPE html>
<html lang="ml">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ICHUNETCKD NEWS ROOM</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#020617;color:white;font-family:Arial,sans-serif;text-align:center;overflow-x:hidden}

/* DJ Lights */
.light{position:fixed;width:120px;height:120px;border-radius:50%;filter:blur(40px);opacity:.8;animation:blink 1s infinite alternate;z-index:0}
.l1{top:0;left:5%;background:#ff0055}
.l2{top:0;right:5%;background:#00ccff;animation-delay:.2s}
.l3{bottom:10%;left:10%;background:#00ff88;animation-delay:.4s}
.l4{bottom:10%;right:10%;background:#ffcc00;animation-delay:.6s}
@keyframes blink{from{opacity:.3;transform:scale(.8)}to{opacity:1;transform:scale(1.3)}}

/* Header */
header{position:relative;z-index:2;background:rgba(0,0,0,.6);padding:16px;text-align:center}
header b{font-size:20px;letter-spacing:1px}

/* Logo */
.logo-wrap{position:relative;z-index:2;margin-top:30px;display:flex;flex-direction:column;align-items:center}
.logo-box{width:230px;height:230px;background:linear-gradient(135deg,#007bff,#00c6ff,#0047ff);border-radius:45px;display:flex;align-items:center;justify-content:center;position:relative;box-shadow:0 0 60px #00aaff}
.i-e{font-size:130px;font-weight:900;letter-spacing:-8px}
.earth{font-size:85px;display:inline-block;animation:spin 4s linear infinite}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
.play{position:absolute;right:15px;top:50%;transform:translateY(-50%);font-size:38px;color:#bfe6ff}

h1{margin-top:18px;font-size:34px;letter-spacing:2px}
.news-room{margin-top:6px;font-size:40px;font-weight:900;color:#00e5ff;text-shadow:0 0 10px #00e5ff,0 0 30px #00e5ff,0 0 60px #0088ff;animation:neon 1s infinite alternate}
@keyframes neon{from{opacity:.7}to{opacity:1}}
.tag{margin-top:14px;font-size:16px;opacity:.85;background:rgba(255,255,255,.1);padding:10px 20px;border-radius:30px;display:inline-block}
.cards{display:flex;gap:12px;justify-content:center;margin:25px 12px;flex-wrap:wrap;position:relative;z-index:2}
.card{background:#0f172a;border:1px solid #1e293b;padding:16px;border-radius:16px;width:150px}
.card b{font-size:16px}
.card p{font-size:13px;opacity:.8;margin-top:6px}

/* Footer */
footer{margin-top:30px;padding:16px;background:#000;font-size:13px;opacity:.9;position:relative;z-index:2}
</style>
</head>
<body>
<div class="light l1"></div><div class="light l2"></div><div class="light l3"></div><div class="light l4"></div>

<header><b>ICHUNETCKD NEWS ROOM</b></header>

<div class="logo-wrap">
  <div class="logo-box"><div class="i-e">I<span class="earth">🌍</span>E</div><div class="play">▶</div></div>
  <h1>ICHUNETCKD</h1>
  <div class="news-room">ന്യൂസ് റൂം</div>
  <div class="tag">LIVE • BREAKING • NEWS</div>
</div>

<div class="cards">
  <div class="card"><b>🔴 LIVE</b><p>ലൈവ് ന്യൂസ്</p></div>
  <div class="card"><b>📰 വാർത്ത</b><p>നമ്മുടെ വാർത്ത</p></div>
  <div class="card"><b>🌦️ കാലാവസ്ഥ</b><p>ഇന്നത്തെ കാലാവസ്ഥ</p></div>
</div>

<footer>© 2026 ICHUNETCKD NEWS ROOM<br>നമ്മുടെ വാർത്ത</footer>
</body>
</html>
